services:
  db:
    image: postgres:15
    container_name: projetosicredi-db-1
    restart: unless-stopped
    env_file: .env
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-etl} -d ${POSTGRES_DB:-sicredi}",
        ]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    container_name: projetosicredi-api-1
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ./dados:/app/dados:rw
      - ./codigos:/app/codigos:ro
    command:
      [
        "uvicorn",
        "app.main:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8000",
        "--workers",
        "1",
      ]

volumes:
  pgdata:
